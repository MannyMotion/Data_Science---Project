<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goal Board</title>
<style>
:root{--bg:#0f1220;--card:#181c2f;--ink:#e8ebff;--muted:#9aa3c7;--line:#2a3050;--accent:#7c9cff;--good:#3ddc97;--warn:#ffb547;--bad:#ff6b81}
@media (prefers-color-scheme: light){:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2140;--muted:#5d668c;--line:#dfe3f0;--accent:#3d5cff;--good:#11a86a;--warn:#c27c00;--bad:#d6334f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h1{margin:0 0 4px;font-size:28px}.vision{color:var(--muted);margin:0 0 20px}
.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stat b{font-size:26px;display:block}
.stat span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.goal.won{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.goal h3{margin:4px 0 6px;font-size:17px}.why{color:var(--muted);font-size:13px;margin:0 0 10px}
.track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:99px;transition:width .8s}
.won .fill{background:var(--good)}.pct{font-size:12px;color:var(--muted);margin:4px 0 8px}
ul{list-style:none;padding:0;margin:0}li{padding:5px 0;border-top:1px solid var(--line);font-size:14px;display:flex;gap:8px}
li.done{color:var(--muted);text-decoration:line-through}.due{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.over{color:var(--bad)!important;font-weight:600}.soon{color:var(--warn)!important}
.reward{margin-top:10px;font-size:13px}.wins{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.wins h2{margin:0 0 8px;font-size:18px}.wins li{border:0;padding:3px 0}
canvas{position:fixed;inset:0;pointer-events:none}
</style></head><body><canvas id="c"></canvas><div class="wrap">
<h1>🎯 Goal Board</h1><p class="vision" id="vision"></p>
<div class="top" id="top"></div><div class="grid" id="grid"></div>
<div class="wins"><h2>🏆 Recent wins</h2><ul id="wins"></ul></div></div>
<script>
const D={"owner": "Manny (Emmanuel Ogbu)", "vision": "Work as a bioinformatician / data scientist by April 2027, with a portfolio that proves I can turn biological data into answers.", "deadline": "2027-04-01", "goals": [{"id": "G1", "title": "Land a bioinformatics / data science job", "category": "Career", "why": "The whole point: a paid role doing the work I trained for, by April 2027.", "target_date": "2027-04-01", "celebration": "Big one - choose it yourself and write it here.", "tasks": [{"id": "G1.1", "title": "Read 10 real job adverts and list the skills that repeat (private/job_hunt/JOB_ADVERT_SKILLS.md)", "due": "2026-11-01", "done": false, "done_on": null}, {"id": "G1.2", "title": "Look up this year's NHS STP bioinformatics + graduate scheme dates (private/job_hunt/APPLICATIONS.md)", "due": "2026-11-01", "done": false, "done_on": null}, {"id": "G1.3", "title": "Update CV: BioAgent + the 470-hypothesis statistics project", "due": "2026-11-08", "done": false, "done_on": null}, {"id": "G1.4", "title": "LinkedIn: new headline + pin BioAgent", "due": "2026-11-08", "done": false, "done_on": null}, {"id": "G1.5", "title": "Send the first 5 applications", "due": "2026-11-15", "done": false, "done_on": null}, {"id": "G1.6", "title": "25 applications sent", "due": "2026-12-20", "done": false, "done_on": null}, {"id": "G1.7", "title": "First interview", "due": "2027-01-31", "done": false, "done_on": null}, {"id": "G1.8", "title": "Job offer accepted", "due": "2027-04-01", "done": false, "done_on": null}]}, {"id": "G2", "title": "Python + pandas fluency", "category": "Skills", "why": "Every bioinformatics and data science job assumes this. It is the foundation for the projects.", "target_date": "2026-12-31", "celebration": "Choose a treat and write it here.", "tasks": [{"id": "G2.1", "title": "Finish the freeCodeCamp 'Learn Python for Data Science' video, typing every example myself", "due": "2026-11-08", "done": false, "done_on": null}, {"id": "G2.2", "title": "Kaggle Learn: Pandas certificate", "due": "2026-11-08", "done": false, "done_on": null}, {"id": "G2.3", "title": "Rosalind: 10 problems solved", "due": "2026-11-15", "done": false, "done_on": null}, {"id": "G2.4", "title": "Git + command-line basics (clone, branch, commit, push; cd, ls, grep, pipes)", "due": "2026-11-30", "done": false, "done_on": null}, {"id": "G2.5", "title": "Kaggle Learn: Intro to Machine Learning certificate", "due": "2026-11-30", "done": false, "done_on": null}, {"id": "G2.6", "title": "Rosalind: 30 problems solved", "due": "2026-12-31", "done": false, "done_on": null}]}, {"id": "G3", "title": "Project 1 - Gene expression analysis (RNA-seq, real GEO data)", "category": "Portfolio", "why": "The classic bioinformatician task. This is the project I talk about in every interview.", "target_date": "2026-12-13", "celebration": "Choose a treat and write it here.", "tasks": [{"id": "G3.1", "title": "Pick a public dataset + the paper it came from (ideally one figure to reproduce)", "due": "2026-11-15", "done": false, "done_on": null}, {"id": "G3.2", "title": "Load, clean and explore the counts (QC plots)", "due": "2026-11-22", "done": false, "done_on": null}, {"id": "G3.3", "title": "Differential expression: healthy vs disease (volcano plot)", "due": "2026-11-29", "done": false, "done_on": null}, {"id": "G3.4", "title": "Pathway / gene-set enrichment on the top genes", "due": "2026-12-06", "done": false, "done_on": null}, {"id": "G3.5", "title": "Write the README: question, data, method, results, figures, limitations", "due": "2026-12-13", "done": false, "done_on": null}]}, {"id": "G4", "title": "Project 2 - Disease prediction with machine learning", "category": "Portfolio", "why": "Shows data science: proper validation, honest metrics, no data leakage.", "target_date": "2027-01-31", "celebration": "Choose a treat and write it here.", "tasks": [{"id": "G4.1", "title": "Choose a gene-expression dataset with disease labels", "due": "2026-12-20", "done": false, "done_on": null}, {"id": "G4.2", "title": "Baseline model with cross-validation (and a held-out test set kept sealed)", "due": "2027-01-10", "done": false, "done_on": null}, {"id": "G4.3", "title": "Feature importance + which genes drive the prediction", "due": "2027-01-24", "done": false, "done_on": null}, {"id": "G4.4", "title": "README write-up with honest results", "due": "2027-01-31", "done": false, "done_on": null}]}, {"id": "G5", "title": "Project 3 - A real pipeline (Snakemake)", "category": "Portfolio", "why": "Closes the gap my friend spotted: 'coding a pipeline' = raw reads to results, reproducible, one command.", "target_date": "2027-02-28", "celebration": "Choose a treat and write it here.", "tasks": [{"id": "G5.1", "title": "Learn the Snakemake basics (rules, inputs, outputs, wildcards)", "due": "2027-02-07", "done": false, "done_on": null}, {"id": "G5.2", "title": "Pipeline: FASTQ -> quality check -> alignment -> gene counts on a small public dataset", "due": "2027-02-21", "done": false, "done_on": null}, {"id": "G5.3", "title": "README + one-command run instructions (conda environment file)", "due": "2027-02-28", "done": false, "done_on": null}]}, {"id": "G6", "title": "Certificates that back up the CV", "category": "Credentials", "why": "Get past CV keyword filters. Supports the projects, never replaces them.", "target_date": "2027-03-31", "celebration": "Choose a treat and write it here.", "tasks": [{"id": "G6.1", "title": "Apply for Coursera financial aid (Johns Hopkins Genomic Data Science)", "due": "2026-11-15", "done": false, "done_on": null}, {"id": "G6.2", "title": "freeCodeCamp: Data Analysis with Python certification", "due": "2026-12-20", "done": false, "done_on": null}, {"id": "G6.3", "title": "Johns Hopkins Genomic Data Science specialization", "due": "2027-03-31", "done": false, "done_on": null}]}, {"id": "G7", "title": "Make my work visible", "category": "Visibility", "why": "Recruiters spend seconds. What they can see quickly decides the interview.", "target_date": "2027-01-15", "celebration": "Choose a treat and write it here.", "tasks": [{"id": "G7.1", "title": "BioAgent README: screenshots + a 2-minute demo GIF/video", "due": "2026-11-08", "done": false, "done_on": null}, {"id": "G7.2", "title": "Clean up this repo's README as my portfolio front page", "due": "2026-11-15", "done": false, "done_on": null}, {"id": "G7.3", "title": "Case-study repo: 'Testing 470 trading hypotheses honestly' (statistics, no account details)", "due": "2027-01-15", "done": false, "done_on": null}]}, {"id": "G8", "title": "Network with people in the field", "category": "Network", "why": "Most jobs come through people. Real problems from real teams make the best projects.", "target_date": "2027-01-31", "celebration": "Choose a treat and write it here.", "tasks": [{"id": "G8.1", "title": "Message Ed + my interviewers: 'what would a junior get in month one?' (private/job_hunt/CONTACTS.md)", "due": "2026-11-01", "done": false, "done_on": null}, {"id": "G8.2", "title": "3 informational chats with bioinformaticians / data scientists", "due": "2026-12-31", "done": false, "done_on": null}, {"id": "G8.3", "title": "5 informational chats", "due": "2027-01-31", "done": false, "done_on": null}]}, {"id": "G9", "title": "Keep the grind sustainable", "category": "Life", "why": "Five months is a marathon. Steady beats burnt out.", "target_date": "2027-04-01", "celebration": "Choose a treat and write it here.", "tasks": [{"id": "G9.1", "title": "Fill in my life goals in private/VISION.md", "due": "2026-11-01", "done": false, "done_on": null}, {"id": "G9.2", "title": "First weekly review done (plan/WEEKLY_REVIEW_TEMPLATE.md)", "due": "2026-11-01", "done": false, "done_on": null}, {"id": "G9.3", "title": "4 weekly reviews in a row", "due": "2026-11-29", "done": false, "done_on": null}]}]}, WINS=["2026-10-26 — 🚀 Built my learning hub, goal board and tracker"], TODAY=new Date("2026-10-26");
const days=s=>Math.round((new Date(s)-TODAY)/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("vision").textContent=D.vision;
const all=D.goals.flatMap(g=>g.tasks), done=all.filter(t=>t.done).length, won=D.goals.filter(g=>g.tasks.length&&g.tasks.every(t=>t.done)).length;
const over=all.filter(t=>!t.done&&days(t.due)<0).length;
document.getElementById("top").innerHTML=[
 [days(D.deadline),"days to "+D.deadline],[done+"/"+all.length,"tasks done ("+Math.round(100*done/all.length)+"%)"],
 [won+"/"+D.goals.length,"goals achieved"],[over,"overdue tasks"]].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
document.getElementById("grid").innerHTML=D.goals.map(g=>{
 const d=g.tasks.filter(t=>t.done).length,n=g.tasks.length,p=n?Math.round(100*d/n):0,w=n&&d===n;
 return `<div class="goal ${w?"won":""}"><div class="cat">${esc(g.category)} · ${esc(g.id)}</div><h3>${w?"🏆 ":""}${esc(g.title)}</h3>
 <p class="why">${esc(g.why)}</p><div class="track"><div class="fill" style="width:${p}%"></div></div><div class="pct">${d}/${n} tasks · ${p}% · target ${esc(g.target_date)}</div>
 <ul>${g.tasks.map(t=>{const l=days(t.due),cls=t.done?"":(l<0?"over":(l<=7?"soon":""));
  return `<li class="${t.done?"done":""}">${t.done?"✅":"⬜"} <span>${esc(t.title)}</span><span class="due ${cls}">${t.done?"done "+esc(t.done_on):(l<0?"overdue "+(-l)+"d":"due "+esc(t.due))}</span></li>`}).join("")}</ul>
 <div class="reward">🎁 ${esc(g.celebration)}</div></div>`}).join("");
document.getElementById("wins").innerHTML=WINS.length?WINS.map(w=>`<li>${w}</li>`).join(""):"<li>No wins yet - tick off your first task!</li>";
// confetti when there is a win from the last 2 days
const recent=all.some(t=>t.done&&t.done_on&&days(t.done_on)>=-2);
if(recent){const c=document.getElementById("c"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const cols=["#7c9cff","#3ddc97","#ffb547","#ff6b81","#c38bff"],P=[...Array(160)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,
 r:4+Math.random()*5,v:2+Math.random()*3,s:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));let f=0;
 (function go(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((f+p.s)/12);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*.6)});
 if(++f<360)requestAnimationFrame(go);else x.clearRect(0,0,c.width,c.height)})();}
</script></body></html>
