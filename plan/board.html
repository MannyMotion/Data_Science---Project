<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goal Board</title>
<style>
:root{--bg:#0f1220;--card:#181c2f;--ink:#e8ebff;--muted:#9aa3c7;--line:#2a3050;--accent:#7c9cff;--good:#3ddc97;--warn:#ffb547;--bad:#ff6b81}
@media (prefers-color-scheme: light){:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2140;--muted:#5d668c;--line:#dfe3f0;--accent:#3d5cff;--good:#11a86a;--warn:#c27c00;--bad:#d6334f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h1{margin:0 0 4px;font-size:28px}.vision{color:var(--muted);margin:0 0 20px}
.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stat b{font-size:26px;display:block}
.stat span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.goal.won{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.goal h3{margin:4px 0 6px;font-size:17px}.why{color:var(--muted);font-size:13px;margin:0 0 10px}
.track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:99px;transition:width .8s}
.won .fill{background:var(--good)}.pct{font-size:12px;color:var(--muted);margin:4px 0 8px}
ul{list-style:none;padding:0;margin:0}li{padding:5px 0;border-top:1px solid var(--line);font-size:14px;display:flex;gap:8px}
li.done{color:var(--muted);text-decoration:line-through}.due{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.over{color:var(--bad)!important;font-weight:600}.soon{color:var(--warn)!important}
.reward{margin-top:10px;font-size:13px}.wins{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.wins h2{margin:0 0 8px;font-size:18px}.wins li{border:0;padding:3px 0}
canvas{position:fixed;inset:0;pointer-events:none}
</style></head><body><canvas id="c"></canvas><div class="wrap">

 <div class="reward">🎁 ${esc(g.celebration)}</div></div>`}).join("");
document.getElementById("wins").innerHTML=WINS.length?WINS.map(w=>`<li>${w}</li>`).join(""):"<li>No wins yet - tick off your first task!</li>";
// confetti when there is a win from the last 2 days
const recent=all.some(t=>t.done&&t.done_on&&days(t.done_on)>=-2);
if(recent){const c=document.getElementById("c"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const cols=["#7c9cff","#3ddc97","#ffb547","#ff6b81","#c38bff"],P=[...Array(160)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,
 r:4+Math.random()*5,v:2+Math.random()*3,s:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));let f=0;
 (function go(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((f+p.s)/12);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*.6)});
 if(++f<360)requestAnimationFrame(go);else x.clearRect(0,0,c.width,c.height)})();}
</script></body></html>
